<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel de projetos — Salton Design</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f9f9f9;
      --orange: #f16001;
      --orange-2: #e85002;
      --red: #c10801;
      --gray-border: rgba(249, 249, 249, 0.14);
      --gray-light: #b7b7b7;
      --gradient: linear-gradient(90deg, var(--orange) 0%, var(--red) 55%, var(--orange-2) 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--black);
      color: var(--white);
      font-family: "Aeonik Pro", "Inter", "Helvetica Neue", Arial, sans-serif;
      padding: 40px 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #111;
      border: 1px solid var(--gray-border);
      border-radius: 18px;
      padding: 32px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 6px;
    }

    .sub {
      color: var(--gray-light);
      font-size: 0.88rem;
      margin: 0 0 22px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
      background: #060606;
      border: 1px solid var(--gray-border);
      border-radius: 999px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-light);
      user-select: none;
    }

    .tab.is-active {
      background: var(--gradient);
      color: var(--white);
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--gray-light);
      margin: 16px 0 6px;
    }

    input[type="text"],
    input[type="url"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--gray-border);
      background: #060606;
      color: var(--white);
      font-size: 0.95rem;
      font-family: inherit;
    }

    input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
      color: var(--gray-light);
      margin-top: 4px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--orange-2);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--gray-light);
      margin-top: 6px;
    }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: var(--gradient);
      color: var(--white);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button.danger {
      background: rgba(193, 8, 1, 0.85);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .msg {
      margin-top: 16px;
      font-size: 0.88rem;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
    }

    .msg.ok {
      display: block;
      background: rgba(30, 160, 60, 0.15);
      border: 1px solid rgba(30, 160, 60, 0.4);
      color: #7fe0a0;
    }

    .msg.err {
      display: block;
      background: rgba(193, 8, 1, 0.15);
      border: 1px solid rgba(193, 8, 1, 0.4);
      color: #ff9a90;
    }

    .preview {
      margin-top: 10px;
      max-width: 100%;
      max-height: 140px;
      border-radius: 8px;
      display: none;
    }

    .current-project {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--gray-border);
      border-radius: 10px;
      background: #060606;
    }

    .current-project img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
    }

    .current-project .info {
      font-size: 0.85rem;
      color: var(--gray-light);
    }

    .current-project .info strong {
      display: block;
      color: var(--white);
      font-size: 0.92rem;
      margin-bottom: 2px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Painel de projetos</h1>
    <p class="sub">Adicione, edite ou remova cases do site. As mudanças aparecem em cerca de 1 minuto.</p>

    <div class="tabs">
      <div class="tab is-active" data-tab="add">Adicionar</div>
      <div class="tab" data-tab="edit">Editar</div>
      <div class="tab" data-tab="delete">Excluir</div>
    </div>

    <form id="form">
      <label for="password">Senha</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <!-- ADICIONAR -->
      <div data-panel="add">
        <label for="category">Categoria</label>
        <select id="category">
          <option value="__new__">+ Nova categoria</option>
        </select>

        <div id="newCategoryWrap">
          <label for="newCategoryLabel">Nome da categoria nova</label>
          <input type="text" id="newCategoryLabel" placeholder="Ex: Motion Design" />
          <p class="hint">Vai aparecer no site com esse título, seguindo o mesmo padrão das outras.</p>
        </div>

        <label for="name">Nome do projeto</label>
        <input type="text" id="name" placeholder="Ex: Estúdio Aurora" />

        <label for="link">Link do Behance</label>
        <input type="url" id="link" placeholder="https://www.behance.net/gallery/..." />

        <label for="image">Capa do projeto</label>
        <input type="file" id="image" accept="image/png, image/jpeg, image/webp" />
        <img id="preview" class="preview" alt="Pré-visualização" />
      </div>

      <!-- EDITAR / EXCLUIR (compartilham a seleção de projeto) -->
      <div data-panel="edit delete" hidden>
        <label for="projectSelect">Qual projeto?</label>
        <select id="projectSelect">
          <option value="">Carregando…</option>
        </select>

        <div class="current-project" id="currentProject">
          <img id="currentProjectImg" src="" alt="" />
          <div class="info">
            <strong id="currentProjectName"></strong>
            <span id="currentProjectCategory"></span>
          </div>
        </div>
      </div>

      <!-- EDITAR -->
      <div data-panel="edit" hidden>
        <label for="editName">Nome do projeto</label>
        <input type="text" id="editName" placeholder="Deixe como está pra não mudar" />

        <label for="editLink">Link do Behance</label>
        <input type="url" id="editLink" placeholder="Deixe como está pra não mudar" />

        <label for="editImage">Nova capa (opcional)</label>
        <input type="file" id="editImage" accept="image/png, image/jpeg, image/webp" />
        <img id="editPreview" class="preview" alt="Pré-visualização" />
      </div>

      <!-- EXCLUIR -->
      <div data-panel="delete" hidden>
        <p class="hint">Essa ação remove o projeto e a imagem dele do site. Não tem como desfazer.</p>
      </div>

      <button type="submit" id="submitBtn">Publicar projeto</button>

      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    const tabs = document.querySelectorAll(".tab");

    const categorySelect = document.getElementById("category");
    const newCategoryWrap = document.getElementById("newCategoryWrap");
    const newCategoryLabel = document.getElementById("newCategoryLabel");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");

    const projectSelect = document.getElementById("projectSelect");
    const currentProject = document.getElementById("currentProject");
    const currentProjectImg = document.getElementById("currentProjectImg");
    const currentProjectName = document.getElementById("currentProjectName");
    const currentProjectCategory = document.getElementById("currentProjectCategory");
    const editName = document.getElementById("editName");
    const editLink = document.getElementById("editLink");
    const editImage = document.getElementById("editImage");
    const editPreview = document.getElementById("editPreview");

    let mode = "add";
    let projectsData = null;

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = "msg " + (ok ? "ok" : "err");
    }

    function clearMsg() {
      msg.className = "msg";
    }

    function setMode(newMode) {
      mode = newMode;
      tabs.forEach((t) => t.classList.toggle("is-active", t.dataset.tab === newMode));
      document.querySelectorAll("[data-panel]").forEach((panel) => {
        const panels = panel.dataset.panel.split(" ");
        panel.hidden = !panels.includes(newMode);
      });
      submitBtn.textContent = newMode === "add" ? "Publicar projeto" : newMode === "edit" ? "Salvar alterações" : "Excluir projeto";
      submitBtn.className = newMode === "delete" ? "danger" : "";
      clearMsg();
    }

    tabs.forEach((tab) => tab.addEventListener("click", () => setMode(tab.dataset.tab)));

    // Reduz a imagem antes de enviar (evita fotos gigantes/lentas de subir)
    function resizeImage(file, maxWidth) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files[0];
      if (!file) return;
      preview.src = await resizeImage(file, 900);
      preview.style.display = "block";
    });

    editImage.addEventListener("change", async () => {
      const file = editImage.files[0];
      if (!file) return;
      editPreview.src = await resizeImage(file, 900);
      editPreview.style.display = "block";
    });

    categorySelect.addEventListener("change", () => {
      newCategoryWrap.style.display = categorySelect.value === "__new__" ? "block" : "none";
    });

    async function loadProjects() {
      try {
        const res = await fetch("data/projects.json", { cache: "no-store" });
        projectsData = await res.json();

        categorySelect.innerHTML =
          projectsData.categories
            .map((cat) => `<option value="${cat.key}">${cat.label}</option>`)
            .join("") + `<option value="__new__">+ Nova categoria</option>`;
        newCategoryWrap.style.display = "none";

        const options = [];
        projectsData.categories.forEach((cat) => {
          cat.items.forEach((item) => {
            options.push({ category: cat.key, categoryLabel: cat.label, id: item.id, name: item.name, image: item.image });
          });
        });

        projectSelect.innerHTML = options.length
          ? options.map((o) => `<option value="${o.category}::${o.id}">${o.categoryLabel} — ${o.name}</option>`).join("")
          : `<option value="">Nenhum projeto ainda</option>`;

        projectSelect.dataset.options = JSON.stringify(options);
        updateCurrentProject();
      } catch (err) {
        console.error(err);
      }
    }

    function updateCurrentProject() {
      const options = JSON.parse(projectSelect.dataset.options || "[]");
      const found = options.find((o) => `${o.category}::${o.id}` === projectSelect.value);
      if (!found) {
        currentProject.style.display = "none";
        return;
      }
      currentProject.style.display = "flex";
      currentProjectImg.src = found.image;
      currentProjectName.textContent = found.name;
      currentProjectCategory.textContent = found.categoryLabel;
      editName.placeholder = found.name;
      editLink.placeholder = "Deixe como está pra não mudar";
    }

    projectSelect.addEventListener("change", updateCurrentProject);

    loadProjects();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();

      const password = document.getElementById("password").value;
      let payload = { password, action: mode };

      if (mode === "add") {
        const file = imageInput.files[0];
        if (!file) {
          showMsg("Escolhe uma capa pro projeto.", false);
          return;
        }
        const category = categorySelect.value;
        if (category === "__new__" && !newCategoryLabel.value.trim()) {
          showMsg("Dá um nome pra categoria nova.", false);
          return;
        }
        const dataUrl = preview.src || (await resizeImage(file, 900));
        payload.category = category === "__new__" ? newCategoryLabel.value.trim() : category;
        payload.categoryLabel = category === "__new__" ? newCategoryLabel.value.trim() : undefined;
        payload.name = document.getElementById("name").value;
        payload.link = document.getElementById("link").value;
        payload.imageBase64 = dataUrl.split(",")[1];
        payload.imageExt = "jpg";
      } else {
        const [category, id] = (projectSelect.value || "").split("::");
        if (!category || !id) {
          showMsg("Escolhe um projeto.", false);
          return;
        }
        payload.category = category;
        payload.id = id;

        if (mode === "edit") {
          if (editName.value.trim()) payload.name = editName.value.trim();
          if (editLink.value.trim()) payload.link = editLink.value.trim();
          const file = editImage.files[0];
          if (file) {
            const dataUrl = editPreview.src || (await resizeImage(file, 900));
            payload.imageBase64 = dataUrl.split(",")[1];
            payload.imageExt = "jpg";
          }
        }

        if (mode === "delete") {
          if (!confirm("Tem certeza que quer excluir esse projeto? Não tem como desfazer.")) return;
        }
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Enviando…";

      try {
        const res = await fetch("/api/add-project", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.error || "Não deu pra publicar. Tenta de novo.", false);
        } else {
          const okText = mode === "add" ? "Publicado!" : mode === "edit" ? "Atualizado!" : "Removido!";
          showMsg(`${okText} Deve aparecer no site em cerca de 1 minuto.`, true);
          form.reset();
          preview.style.display = "none";
          editPreview.style.display = "none";
          await loadProjects();
        }
      } catch (err) {
        showMsg("Erro de conexão. Tenta de novo.", false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    setMode("add");
  </script>
</body>
</html>
